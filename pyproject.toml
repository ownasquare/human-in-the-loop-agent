[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "relay-hitl-agent"
version = "0.1.0"
description = "An approval-first LangGraph operations agent with durable human review."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Fortune Vieyra" }]
keywords = ["agents", "human-in-the-loop", "langgraph", "anthropic", "workflow", "safety"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "aiosqlite>=0.22,<1",
  "fastapi>=0.139,<1",
  "filelock>=3.20,<4",
  "httpx>=0.28,<1",
  "langchain>=1.3.3,<2",
  "langchain-anthropic>=1.4.8,<2",
  "langgraph>=1.2.8,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "python-dotenv>=1.2,<2",
  "rich>=14.3,<15",
  "tavily-python>=0.7,<1",
  "typer>=0.24,<1",
  "uvicorn[standard]>=0.51,<1",
]

[project.urls]
Homepage = "https://github.com/ownasquare/human-in-the-loop-agent"
Repository = "https://github.com/ownasquare/human-in-the-loop-agent.git"
Documentation = "https://github.com/ownasquare/human-in-the-loop-agent#readme"
Issues = "https://github.com/ownasquare/human-in-the-loop-agent/issues"
Changelog = "https://github.com/ownasquare/human-in-the-loop-agent/blob/main/CHANGELOG.md"

[project.scripts]
relay = "relay.cli:app"
relay-api = "relay.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.19,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7,<8",
  "pytest-socket>=0.7,<1",
  "respx>=0.22,<1",
  "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: exercises file-backed persistence or the complete LangGraph workflow",
  "live: requires explicitly configured external provider credentials",
]

[tool.coverage.run]
branch = true
source = ["relay"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["relay"]

[[tool.mypy.overrides]]
module = ["tavily.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
