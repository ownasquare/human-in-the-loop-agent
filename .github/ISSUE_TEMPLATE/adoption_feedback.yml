name: Usage and adoption feedback
description: Tell us what worked and where Relay's setup or core workflow became unclear.
title: "[Feedback]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: >-
        Keep this form public and sanitized. Report vulnerabilities through
        [GitHub's private security form](https://github.com/ownasquare/human-in-the-loop-agent/security/advisories/new).
  - type: dropdown
    id: setup
    attributes:
      label: Setup path
      options:
        - Docker walkthrough
        - Source development setup
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What were you trying to do, and how far did you get?
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: Confusing point
      description: What instruction, screen, or workflow step was hardest to understand?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: What small change would have made the experience clearer?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, API keys, .env files, email addresses, calendar data, and customer records.
          required: true
